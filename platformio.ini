; Raspberry Pi Pico 2 W (RP2350) + Arduino-Pico / PlatformIO
[env:pico2_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
build_src_filter = +<main.cpp>

; Use Earle Philhower's Arduino-Pico core, which supports the RP2350 and Pico 2 W.
board_build.core = earlephilhower

monitor_speed = 115200
upload_protocol = picotool
upload_port = COM11 ; This port can change depending on your system. Remember to manually check this before flashing.

; Wi-Fi credentials and the laptop echo-server address live in include/secrets.h.
; Copy include/secrets.example.h to include/secrets.h and edit the values locally.

[env:esp32_s3_ap]
platform = espressif32
; Freenove ESP32-S3 WROOM N8R8: 8 MB flash and 8 MB PSRAM.
board = freenove_esp32_s3_wroom
framework = arduino
build_src_filter = +<esp32_ap.cpp>
; The Freenove profile defaults Serial to UART0.  This board is connected
; through the S3's USB Serial/JTAG device at COM17, so select that console.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_port = COM17 ; This port can change depending on your system. Remember to manually check this before flashing.

; Local AP settings live in include/esp32_hotspot_secrets.h.
