; Raspberry Pi Pico 2 W (RP2350) + Arduino-Pico / PlatformIO
[env:pico2_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino

; Use Earle Philhower's Arduino-Pico core, which supports the RP2350 and Pico 2 W.
board_build.core = earlephilhower

monitor_speed = 115200
upload_protocol = picotool
